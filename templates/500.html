{% extends "base.html" %}

{% block title %}Error del Servidor - Bot Financiero{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="fas fa-bug text-danger" style="font-size: 5rem;"></i>
                    </div>
                    
                    <h1 class="display-4 fw-bold text-danger mb-3">500</h1>
                    <h2 class="h3 mb-4">¡Error interno del servidor!</h2>
                    
                    <p class="lead text-muted mb-4">
                        Lo sentimos, algo salió mal en nuestro servidor. Nuestro equipo técnico ha sido notificado.
                    </p>
                    
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Ir al Inicio
                        </a>
                        <button onclick="window.location.reload()" class="btn btn-outline-primary">
                            <i class="fas fa-redo me-2"></i>Recargar Página
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
