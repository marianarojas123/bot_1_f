{% extends "base.html" %}

{% block title %}Página no encontrada - Bot Financiero{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
                    </div>
                    
                    <h1 class="display-4 fw-bold text-danger mb-3">404</h1>
                    <h2 class="h3 mb-4">¡Página no encontrada!</h2>
                    
                    <p class="lead text-muted mb-4">
                        Lo sentimos, la página que buscas no existe o ha sido movida.
                    </p>
                    
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Ir al Inicio
                        </a>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">
                            <i class="fas fa-chart-line me-2"></i>Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
